<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - File Sharing System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-brand">
      <div class="logo">F</div>
    </div>
    <h1 id="pageTitle">Create your account</h1>
    <p class="auth-subtitle" id="pageSubtitle">Sign up to start sharing files securely</p>

    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>

    <form id="signupForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="new-password" required minlength="8" />
        <small>Min 8 characters, with uppercase, lowercase, number, and symbol</small>
      </div>
      <button type="submit" class="btn" id="submitBtn">Sign Up</button>
    </form>

    <form id="confirmForm" style="display: none">
      <div class="form-group">
        <label for="code">Verification code</label>
        <input type="text" id="code" inputmode="numeric" required />
        <small>Check your email inbox (and spam folder) for the code</small>
      </div>
      <button type="submit" class="btn" id="confirmBtn">Confirm Account</button>
    </form>

    <div class="link-row">
      Already have an account? <a href="login.html">Log in</a>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (isLoggedIn()) window.location.href = "dashboard.html";

    let signedUpEmail = "";
    const errorMsg = document.getElementById("errorMsg");
    const successMsg = document.getElementById("successMsg");

    document.getElementById("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const submitBtn = document.getElementById("submitBtn");

      errorMsg.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span>Signing up...';

      try {
        await signUp(email, password);
        signedUpEmail = email;
        document.getElementById("signupForm").style.display = "none";
        document.getElementById("confirmForm").style.display = "block";
        document.getElementById("pageTitle").textContent = "Verify your email";
        document.getElementById("pageSubtitle").textContent = `We sent a code to ${email}`;
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign Up";
      }
    });

    document.getElementById("confirmForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const code = document.getElementById("code").value.trim();
      const confirmBtn = document.getElementById("confirmBtn");

      errorMsg.style.display = "none";
      confirmBtn.disabled = true;
      confirmBtn.innerHTML = '<span class="spinner"></span>Confirming...';

      try {
        await confirmSignUp(signedUpEmail, code);
        successMsg.textContent = "Account confirmed! Redirecting to login...";
        successMsg.style.display = "block";
        setTimeout(() => (window.location.href = "login.html"), 1500);
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = "block";
        confirmBtn.disabled = false;
        confirmBtn.textContent = "Confirm Account";
      }
    });
  </script>
</body>
</html>
