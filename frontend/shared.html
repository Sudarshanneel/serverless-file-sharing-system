<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shared File - File Sharing System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">
  <div class="auth-container">
    <div id="content">
      <div style="text-align: center; color: var(--text-muted); padding: 20px 0;">
        <span class="spinner" style="border-top-color: var(--primary); border-color: rgba(79,70,229,0.2);"></span>
        Checking link...
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script>
    async function loadSharedFile() {
      const params = new URLSearchParams(window.location.search);
      const shareId = params.get("shareId");
      const content = document.getElementById("content");

      if (!shareId) {
        renderError("No share link was provided.");
        return;
      }

      try {
        const response = await fetch(`${CONFIG.API_BASE_URL}/share/${shareId}`);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "This link is invalid or has expired.");
        }

        content.innerHTML = `
          <div class="shared-icon">📄</div>
          <div class="shared-filename">${escapeHtml(data.fileName)}</div>
          <div class="shared-subtitle">This file is ready to download</div>
          <a href="${data.downloadUrl}" class="btn" style="display: block; text-align: center; text-decoration: none;">
            Download File
          </a>
        `;
      } catch (err) {
        renderError(err.message);
      }
    }

    function renderError(message) {
      document.getElementById("content").innerHTML = `
        <div class="shared-icon" style="background: var(--danger-bg); color: var(--danger);">⚠</div>
        <div class="shared-filename">Link unavailable</div>
        <div class="shared-subtitle">${escapeHtml(message)}</div>
      `;
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    loadSharedFile();
  </script>
</body>
</html>
